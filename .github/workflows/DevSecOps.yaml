# Goal - To run end to end devsecops pipeline
name: devsecops

on:
  push:
    branches: [master]

jobs:

  code-quality:
    uses: ./.github/workflows/code-quality.yaml
  
  secret-scan:
    uses: ./.github/workflows/secret-scanning.yaml

  dependency-scan:
    uses: ./.github/workflows/dependency-scan.yaml

  docker-scan:
    uses: ./.github/workflows/docker-scan.yaml
    secrets: inherit

  sonarqube:
    uses: ./.github/workflows/sonarqube-scan.yaml
    secrets: inherit
  
  code-test:
    uses: ./.github/workflows/code-test.yaml

  docker-push:
    uses: ./.github/workflows/docker-push.yaml
    needs: [code-quality, secret-scan, dependency-scan, docker-scan, sonarqube, code-test]
    secrets: inherit

