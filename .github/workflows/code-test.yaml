#Goal - to run testcase
name: Code testcase

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/Checkout@v7
      
      - name: set up node
        uses: actions/setup-node@v6 
        with:
          node-version: '24.x'
      
      - name: test code
        run: npm run test
        working-directory: frontend

      - name: setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
        
      - name: Run Tests
        run: go test
        working-directory: backend