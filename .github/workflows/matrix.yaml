#Goal - to install multiple version of go and do linting
name: Go Linting

on:
  workflow_dispatch
  # schedule:
  #   - cron: '35 14 * * *'

jobs:
  go-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    strategy:
      matrix:
        go-version: ['1.22', '1.23', '1.24']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Run go fmt
        run: go fmt

      - name: Run go vet
        run: go vet